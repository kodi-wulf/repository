name: Build and deploy Kodi repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  REPO_BASE_URL: https://kodi-wulf.github.io/repository/
  REPO_VERSION: 1.33.7a

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, linux, x64, legion]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair legacy add-on artwork manifests
        run: python3 tools/repair_addon_assets.py "$GITHUB_WORKSPACE"

      - name: Generate repository metadata and Jekyll navigation
        run: |
          python3 tools/build.py --root "$GITHUB_WORKSPACE" --cleanup-legacy
          python3 tools/build.py --root "$GITHUB_WORKSPACE" --base-url "$REPO_BASE_URL" --repo-version "$REPO_VERSION" --installer-only
          python3 tools/build.py --root "$GITHUB_WORKSPACE" --base-url "$REPO_BASE_URL" --repo-version "$REPO_VERSION" --site-only

      - name: Compile and validate build tools
        run: |
          set -o pipefail
          status=0
          for file in tools/*.py; do
            echo "=== py_compile: $file ==="
            if ! python3 -m py_compile "$file"; then
              status=1
            fi
          done
          exit "$status"

      - name: Validate repository
        run: python3 tools/validate_repo.py

      - name: Validate add-on artwork
        run: python3 tools/validate_addon_assets.py

      - name: Audit package versions, dependencies and upstream activity
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/audit_addons.py

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: kodi-wulf-addon-audit
          path: audit/
          if-no-files-found: error

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload generated Pages source
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-source
          path: ./

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download generated Pages source
        uses: actions/download-artifact@v4
        with:
          name: github-pages-source
          path: source-artifact

      - name: Extract generated Pages source
        run: |
          mkdir source
          tar -xf source-artifact/artifact.tar -C source

      - name: Render Jekyll website
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./source
          destination: ./_site

      - name: Validate rendered website and assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import unquote, urlsplit

          site = Path("_site")
          class Assets(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "script":
                      url = attrs.get("src", "")
                  elif tag == "link" and attrs.get("rel") == "stylesheet":
                      url = attrs.get("href", "")
                  else:
                      return
                  parsed = urlsplit(url)
                  if not url or parsed.scheme or parsed.netloc:
                      return
                  path = unquote(parsed.path)
                  if path.startswith("/"):
                      assert path.startswith("/repository/"), f"Wrong base URL: {url}"
                      target = site / path.removeprefix("/repository/")
                  else:
                      target = self.page.parent / path
                  assert target.is_file(), f"Missing asset in {self.page}: {url}"

          for name in ("index.html", "how-to-use.html", "assets/theme.css", "assets/files.js", "assets/app.js"):
              assert (site / name).is_file(), f"Missing published file: {name}"
          pages = list(site.rglob("*.html"))
          for page in pages:
              content = page.read_text(encoding="utf-8")
              assert not content.startswith("---"), f"Unrendered front matter: {page}"
              assert "{{" not in content and "{%" not in content, f"Unrendered Liquid: {page}"
              parser = Assets()
              parser.page = page
              parser.feed(content)
          for package in Path("source").rglob("*.zip"):
              assert (site / package.relative_to("source")).is_file(), f"Missing ZIP: {package}"
          print(f"Validated {len(pages)} rendered pages, local assets and ZIP downloads")
          PY

      - name: Upload rendered Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
