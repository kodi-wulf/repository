name: Build and deploy Kodi repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  REPO_BASE_URL: https://kodi-wulf.github.io/repository/
  REPO_VERSION: 1.33.7a

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair legacy add-on artwork manifests
        run: python3 tools/repair_addon_assets.py "$GITHUB_WORKSPACE"

      - name: Generate repository metadata and Jekyll navigation
        run: |
          python3 tools/build.py --root "$GITHUB_WORKSPACE" --cleanup-legacy
          python3 tools/build.py --root "$GITHUB_WORKSPACE" --base-url "$REPO_BASE_URL" --repo-version "$REPO_VERSION" --installer-only
          python3 tools/build.py --root "$GITHUB_WORKSPACE" --base-url "$REPO_BASE_URL" --repo-version "$REPO_VERSION" --site-only

      - name: Compile and validate build tools
        run: |
          set -o pipefail
          status=0
          for file in tools/*.py; do
            echo "=== py_compile: $file ==="
            if ! python3 -m py_compile "$file"; then
              status=1
            fi
          done
          exit "$status"

      - name: Validate repository
        run: python3 tools/validate_repo.py

      - name: Validate add-on artwork
        run: python3 tools/validate_addon_assets.py

      - name: Audit package versions, dependencies and upstream activity
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/audit_addons.py

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: kodi-wulf-addon-audit
          path: audit/
          if-no-files-found: error

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
