name: Build and deploy Kodi repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

env:
  REPO_BASE_URL: https://kodi-wulf.github.io/repository/
  REPO_VERSION: 1.33.7a

defaults:
  run:
    shell: bash

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ toJSON(github.event.repository.private) == 'false' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Stage tracked site source
        run: |
          mkdir source
          git archive --format=tar HEAD | tar -xf - -C source

      - name: Preserve ZIPs and generate repository metadata and Jekyll navigation
        working-directory: source
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import hashlib
          import os
          import subprocess
          import sys

          def zip_inventory(root):
              hashes = Counter()
              for package in root.rglob("*"):
                  relative = package.relative_to(root)
                  if ".git" in relative.parts:
                      continue
                  assert not package.is_symlink(), f"Symbolic link cannot be published: {relative}"
                  if {".agents", ".drdebug-backups"}.intersection(relative.parts):
                      continue
                  if package.suffix.casefold() != ".zip" or not package.is_file():
                      continue
                  with package.open("rb") as content:
                      hashes[hashlib.file_digest(content, "sha256").hexdigest()] += 1
              return hashes

          root = Path.cwd()
          before = zip_inventory(root)
          subprocess.run([
              sys.executable, "tools/build.py", "--root", str(root), "--apply", "--cleanup-legacy",
              "--base-url", os.environ["REPO_BASE_URL"], "--repo-version", os.environ["REPO_VERSION"],
          ], check=True)
          assert not before - zip_inventory(root), "original ZIPs missing after build"
          PY

      - name: Compile and validate build tools
        working-directory: source
        run: |
          set -o pipefail
          status=0
          for file in tools/*.py; do
            echo "=== py_compile: $file ==="
            if ! python3 -m py_compile "$file"; then
              status=1
            fi
          done
          exit "$status"

      - name: Validate repository
        working-directory: source
        run: |
          python3 -B -m unittest discover -s tests -v
          python3 tools/validate_repo.py

      - name: Validate add-on artwork
        working-directory: source
        run: python3 tools/validate_addon_assets.py

      - name: Audit package versions, dependencies and upstream activity
        working-directory: source
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/audit_addons.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Render Jekyll website
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./source
          destination: ./_site

      - name: Validate rendered website and assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import unquote, urlsplit
          import hashlib

          site = Path("_site")
          class Assets(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "script":
                      url = attrs.get("src", "")
                  elif tag == "link" and attrs.get("rel") == "stylesheet":
                      url = attrs.get("href", "")
                  else:
                      return
                  parsed = urlsplit(url)
                  if not url or parsed.scheme or parsed.netloc:
                      return
                  path = unquote(parsed.path)
                  if path.startswith("/"):
                      assert path.startswith("/repository/"), f"Wrong base URL: {url}"
                      target = site / path.removeprefix("/repository/")
                  else:
                      target = self.page.parent / path
                  assert target.is_file(), f"Missing asset in {self.page}: {url}"

          for name in ("index.html", "how-to-use.html", "assets/theme.css", "assets/files.js", "assets/app.js"):
              assert (site / name).is_file(), f"Missing published file: {name}"
          pages = list(site.rglob("*.html"))
          for page in pages:
              content = page.read_text(encoding="utf-8")
              assert not content.startswith("---"), f"Unrendered front matter: {page}"
              assert "{{" not in content and "{%" not in content, f"Unrendered Liquid: {page}"
              parser = Assets()
              parser.page = page
              parser.feed(content)
          for package in Path("source").rglob("*"):
              assert not package.is_symlink(), f"Symbolic link in Pages source: {package}"
              if package.suffix.casefold() != ".zip" or not package.is_file():
                  continue
              published = site / package.relative_to("source")
              assert published.is_file(), f"Missing ZIP: {package}"
              with package.open("rb") as original, published.open("rb") as rendered:
                  assert hashlib.file_digest(original, "sha256").digest() == hashlib.file_digest(rendered, "sha256").digest(), f"Changed ZIP: {package}"
          published_bytes = 0
          for path in site.rglob("*"):
              assert not path.is_symlink(), f"Symbolic link in rendered Pages: {path}"
              if path.is_file():
                  published_bytes += path.stat().st_size
          assert published_bytes < 1_000_000_000, f"Pages artifact exceeds the ZIP library size budget: {published_bytes} bytes"
          print(f"Validated {len(pages)} rendered pages, local assets and ZIP downloads")
          PY

      - name: Check temporary artifact storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Measure the same tar input the Pages upload action compresses.
          pages_bytes=$(tar -C _site --exclude=.git --exclude=.github -cf - . | gzip -6 -c | wc -c)
          audit_bytes=$(find source/audit -type f -printf '%s\n' | awk '{total += $1} END {printf "%.0f", total}')
          repositories=$(gh api --paginate "orgs/$GITHUB_REPOSITORY_OWNER/repos?type=all&per_page=100" --jq '.[].full_name')
          if ! grep -Fxq "$GITHUB_REPOSITORY" <<< "$repositories"; then
            echo "Could not verify the publishing repository for the storage check." >&2
            exit 1
          fi
          stored_bytes=$(
            while IFS= read -r repo; do
              gh api --paginate "repos/$repo/actions/artifacts?per_page=100" \
                --jq '.artifacts[] | select(.expired == false) | .size_in_bytes' || exit 1
            done <<< "$repositories" | awk '{total += $1} END {printf "%.0f", total}'
          )
          # Keep headroom for ZIP tooling and container headers, without a second Pages archive.
          if (( stored_bytes + pages_bytes + audit_bytes + 1000000 > 500000000 )); then
            echo "Artifact upload exceeds the scoped 500 MB storage budget." >&2
            echo "Existing: $stored_bytes; estimated Pages: $pages_bytes; audit: $audit_bytes bytes." >&2
            exit 1
          fi
          echo "Artifact budget passed: $stored_bytes existing and $pages_bytes estimated Pages bytes."

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: kodi-wulf-addon-audit
          path: source/audit/
          if-no-files-found: error

      - name: Upload rendered Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
