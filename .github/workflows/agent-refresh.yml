name: Agent repository refresh

on:
  push:
    branches:
      - agent/repository-maintenance-20260908
    paths:
      - .github/workflows/agent-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: [self-hosted, linux, x64, legion]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import verified original packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p zips

          curl -fL --retry 3 -o zips/plugin.video.cumination-1.1.198.zip \
            https://raw.githubusercontent.com/dobbelina/repository.dobbelina/master/plugin.video.cumination/plugin.video.cumination-1.1.198.zip
          curl -fL --retry 3 -o zips/plugin.video.dailymotion_com-2.4.5.zip \
            https://mirrors.kodi.tv/addons/omega/plugin.video.dailymotion_com/plugin.video.dailymotion_com-2.4.5.zip
          curl -fL --retry 3 -o zips/resource.language.de_de-11.0.109.zip \
            https://mirrors.kodi.tv/addons/omega/resource.language.de_de/resource.language.de_de-11.0.109.zip
          curl -fL --retry 3 -o zips/script.module.jurialmunkey-0.2.28.zip \
            https://mirrors.kodi.tv/addons/omega/script.module.jurialmunkey/script.module.jurialmunkey-0.2.28.zip
          curl -fL --retry 3 -o zips/script.module.kodi-six-0.1.3.1.zip \
            https://mirrors.kodi.tv/addons/omega/script.module.kodi-six/script.module.kodi-six-0.1.3.1.zip
          curl -fL --retry 3 -o zips/script.module.musicbrainz-0.7.0.zip \
            https://raw.githubusercontent.com/kodi-community-addons/repository.marcelveldt/master/matrix/script.module.musicbrainz/script.module.musicbrainz-0.7.0.zip
          curl -fL --retry 3 -o zips/script.module.resolveurl.xxx-2.1.44.zip \
            https://raw.githubusercontent.com/Gujal00/smrzips/master/zips/script.module.resolveurl.xxx/script.module.resolveurl.xxx-2.1.44.zip
          curl -fL --retry 3 -o zips/repository.kodinerds-7.0.1.7.zip \
            https://repo.kodinerds.net/addons/repository.kodinerds/repository.kodinerds-7.0.1.7.zip
          curl -fL --retry 3 -o zips/repository.zachmorris-1.0.4.zip \
            https://raw.githubusercontent.com/zach-morris/repository.zachmorris/master/repository.zachmorris/repository.zachmorris-1.0.4.zip

          python3 tools/build.py --apply

          rm -f \
            plugins/video/plugin.video.cumination/plugin.video.cumination-1.1.164.zip \
            plugins/video/plugin.video.dailymotion_com/plugin.video.dailymotion_com-2.4.4.zip \
            repository/chamchenko-dev/chamchenko-dev-0.0.3.zip \
            repository/repository.acestream-channels/repository.acestream-channels-1.0.0.zip \
            repository/repository.acestream-channels/repository.acestream-channels-1.2.0.zip \
            repository/repository.alado.tv/repository.alado.tv-0.0.3.zip \
            repository/repository.arxtic-ape/repository.arxtic-ape-1.0.0.zip \
            repository/repository.asgardrepo/repository.asgardrepo-0.0.4.zip \
            repository/repository.bleak-lodge/repository.bleak-lodge-1.0.zip \
            repository/repository.centry/repository.centry-0.0.1.zip \
            repository/repository.cywteow/repository.cywteow-1.1.1.zip \
            repository/repository.fivebanger/repository.fivebanger-1.1.0.zip \
            repository/repository.giaitri/repository.giaitri-1.2.0.zip \
            repository/repository.host505/repository.host505-2.5.zip \
            repository/repository.kodi.reavey05.com/repository.kodi.reavey05.com-0.1.6.zip \
            repository/repository.mtr81/repository.mtr81-1.0.zip \
            repository/repository.opencode/repository.opencode-1.0.0.zip \
            repository/repository.pikdum/repository.pikdum-0.1.0.zip \
            repository/repository.pogowurst.addons/repository.pogowurst.addons-1.0.0a.zip \
            repository/repository.sandmann79-py3.plugins/repository.sandmann79-py3.plugins-1.0.4.zip \
            repository/repository.sandmann79.plugins/repository.sandmann79.plugins-1.0.3.zip \
            repository/repository.sandmann79.plugins/repository.sandmann79.plugins-2.0.0.zip \
            repository/repository.sniper/repository.sniper-1.0.1.zip \
            repository/repository.t4krepo/repository.t4krepo-1.2.5a.zip \
            repository/repository.wetdreams69/repository.wetdreams69-1.0.6.zip \
            repository/repository.yt.testing_unofficial/repository.yt.testing_unofficial-2.0.5.zip \
            script/module/TMDb-Helper-Players/TMDb-Helper-Players.zip \
            script/module/resource.language.de_de/resource.language.de_de-11.0.105.zip

          python3 tools/build.py --apply
          test ! -d zips || ! find zips -type f -print -quit | grep -q .

      - name: Verify refreshed tree in isolation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify="$(mktemp -d)"
          tar --exclude=.git --exclude=audit -cf - . | tar -xf - -C "$verify"
          cd "$verify"
          python3 tools/repair_addon_assets.py .
          for file in tools/*.py; do
            echo "=== py_compile: $file ==="
            python3 -m py_compile "$file"
          done
          python3 tools/validate_repo.py
          python3 tools/validate_addon_assets.py
          python3 tools/audit_addons.py

      - name: Commit refreshed repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .
          git diff --cached --check
          git commit -m "feat(repo): refresh validated upstream packages"
          git push origin HEAD
